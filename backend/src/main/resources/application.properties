spring.application.name=tallerpro-api
# Render asigna el puerto vía la variable de entorno PORT; localmente usa 8080.
server.port=${PORT:8080}

# Perfil por defecto (desarrollo local): H2 embebido en archivo, los datos sobreviven
# entre reinicios sin requerir instalar una base de datos aparte. En producción (Render)
# se activa el perfil "production" (ver application-production.properties), que usa
# Postgres en su lugar — SPRING_PROFILES_ACTIVE=production lo hace el propio render.yaml.
spring.datasource.url=jdbc:h2:file:./data/tallerpro;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Consola web de H2 (http://localhost:8080/h2-console) — solo para desarrollo local.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.cors.allowed-origins=http://localhost:5173
