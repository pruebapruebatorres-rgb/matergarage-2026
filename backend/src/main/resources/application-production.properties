# Perfil de producción (Render). Se activa con SPRING_PROFILES_ACTIVE=production
# (ver render.yaml en la raíz del repo, que también inyecta DB_HOST/DB_PORT/DB_NAME/
# DB_USER/DB_PASSWORD desde la base de datos Postgres provisionada por el Blueprint).

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# La consola H2 no aplica con Postgres.
spring.h2.console.enabled=false

# Dominio(s) del frontend en Vercel, separados por coma si hay más de uno
# (p. ej. dominio de producción + preview). Se define como env var en Render.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
